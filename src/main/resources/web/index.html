        async function loadSshConfig() {
            try {
                // Fetch persistent server configuration from CentralMemory / MapDB
                const res = await fetch('/api/ssh/config');
                if (res.ok) {
                    const cfg = await res.json();
                    if (cfg.configured) {
                        if (cfg.host && document.getElementById('sshModalHost')) document.getElementById('sshModalHost').value = cfg.host;
                        if (cfg.port && document.getElementById('sshModalPort')) document.getElementById('sshModalPort').value = cfg.port;
                        if (cfg.username && document.getElementById('sshModalUser')) document.getElementById('sshModalUser').value = cfg.username;
                        if (cfg.alias && document.getElementById('sshModalAlias')) document.getElementById('sshModalAlias').value = cfg.alias;
                        if (cfg.authType && document.getElementById('sshModalAuthType')) {
                            document.getElementById('sshModalAuthType').value = cfg.authType;
                            onSshAuthTypeChange();
                        }
                        if (cfg.privateKeyPath && document.getElementById('sshModalKeyPath')) {
                            document.getElementById('sshModalKeyPath').value = cfg.privateKeyPath;
                        }
                        if (document.getElementById('sshModalAutoConnect')) {
                            document.getElementById('sshModalAutoConnect').checked = !!cfg.autoConnect;
                        }
                        if (cfg.hasPassword && document.getElementById('sshModalPassword')) {
                            document.getElementById('sshModalPassword').placeholder = '•••••••• (Saved password)';
                        }
                        if (cfg.hasPrivateKeyContent && document.getElementById('sshModalKeyContent')) {
                            document.getElementById('sshModalKeyContent').placeholder = '[Using securely saved private key]';
                        }
                        if (cfg.hasPassphrase && document.getElementById('sshModalPassphrase')) {
                            document.getElementById('sshModalPassphrase').placeholder = '•••••••• (Saved passphrase)';
                        }
                        return;
                    }
                }
            } catch (e) {
                console.warn('Could not fetch backend SSH config, falling back to local storage', e);
            }

            try {
                const raw = localStorage.getItem(SSH_CONFIG_KEY);
                if (raw) {
                    const cfg = JSON.parse(raw);
                    if (cfg.host && document.getElementById('sshModalHost')) document.getElementById('sshModalHost').value = cfg.host;
                    if (cfg.port && document.getElementById('sshModalPort')) document.getElementById('sshModalPort').value = cfg.port;
                    if (cfg.username && document.getElementById('sshModalUser')) document.getElementById('sshModalUser').value = cfg.username;
                    if (cfg.alias && document.getElementById('sshModalAlias')) document.getElementById('sshModalAlias').value = cfg.alias;
                    if (cfg.authType && document.getElementById('sshModalAuthType')) {
                        document.getElementById('sshModalAuthType').value = cfg.authType;
                        onSshAuthTypeChange();
                    }
                    if (cfg.keyPath && document.getElementById('sshModalKeyPath')) {
                        document.getElementById('sshModalKeyPath').value = cfg.keyPath;
                    }
                    if (document.getElementById('sshModalAutoConnect') && cfg.autoConnect !== undefined) {
                        document.getElementById('sshModalAutoConnect').checked = !!cfg.autoConnect;
                    }
                }
            } catch (e) {
                console.error('Failed to load SSH config:', e);
            }
        }

        function saveSshConfigNonSensitive(host, port, username, authType, alias, keyPath, autoConnect) {
            try {
                // SECURITY AUDIT: Only non-sensitive connection parameters are saved.
                // Raw passwords and private key contents are NEVER written to localStorage.
                const cfg = {
                    host: host || '',
                    port: port || 22,
                    username: username || '',
                    authType: authType || 'PASSWORD',
                    alias: alias || 'default',
                    keyPath: keyPath || '',
                    autoConnect: !!autoConnect
                };
                localStorage.setItem(SSH_CONFIG_KEY, JSON.stringify(cfg));
            } catch (e) {
                console.error('Failed to save SSH config:', e);
            }
        }

        function onSshAuthTypeChange() {
            const authType = document.getElementById('sshModalAuthType').value;
            const rowPass = document.getElementById('sshRowPassword');
            const rowKeyPath = document.getElementById('sshRowKeyPath');
            const rowKeyContent = document.getElementById('sshRowKeyContent');
            const rowPassphrase = document.getElementById('sshRowPassphrase');

            if (authType === 'PASSWORD') {
                if (rowPass) rowPass.style.display = 'flex';
                if (rowKeyPath) rowKeyPath.style.display = 'none';
                if (rowKeyContent) rowKeyContent.style.display = 'none';
                if (rowPassphrase) rowPassphrase.style.display = 'none';
            } else if (authType === 'KEY_FILE') {
                if (rowPass) rowPass.style.display = 'none';
                if (rowKeyPath) rowKeyPath.style.display = 'flex';
                if (rowKeyContent) rowKeyContent.style.display = 'none';
                if (rowPassphrase) rowPassphrase.style.display = 'flex';
            } else if (authType === 'KEY_CONTENT') {
                if (rowPass) rowPass.style.display = 'none';
                if (rowKeyPath) rowKeyPath.style.display = 'none';
                if (rowKeyContent) rowKeyContent.style.display = 'flex';
                if (rowPassphrase) rowPassphrase.style.display = 'flex';
            }
        }

        function showSshBanner(type, message) {
            const banner = document.getElementById('sshModalStatusBanner');
            if (!banner) return;
            banner.className = 'ssh-status-banner ' + type;
            banner.innerHTML = message;
            banner.style.display = 'block';
        }

        function hideSshBanner() {
            const banner = document.getElementById('sshModalStatusBanner');
            if (banner) {
                banner.style.display = 'none';
                banner.innerHTML = '';
            }
        }

        function openSshModal() {
            const overlay = document.getElementById('sshModalOverlay');
            if (!overlay) return;
            loadSshConfig();
            hideSshBanner();
            overlay.classList.add('active');
            checkSshStatus();
        }

        function closeSshModal() {
            const overlay = document.getElementById('sshModalOverlay');
            if (overlay) overlay.classList.remove('active');
            // Secure memory cleanup
            clearSshSecrets();
        }

        function clearSshSecrets() {
            const passEl = document.getElementById('sshModalPassword');
            const keyContentEl = document.getElementById('sshModalKeyContent');
            const passphraseEl = document.getElementById('sshModalPassphrase');
            if (passEl) passEl.value = '';
            if (keyContentEl) keyContentEl.value = '';
            if (passphraseEl) passphraseEl.value = '';
        }

        async function connectSsh() {
            const host = document.getElementById('sshModalHost').value.trim();
            const port = parseInt(document.getElementById('sshModalPort').value.trim(), 10) || 22;
            const username = document.getElementById('sshModalUser').value.trim();
            const authType = document.getElementById('sshModalAuthType').value;
            const sessionAlias = document.getElementById('sshModalAlias').value.trim() || 'default';

            const passwordInput = document.getElementById('sshModalPassword');
            const keyPathInput = document.getElementById('sshModalKeyPath');
            const keyContentInput = document.getElementById('sshModalKeyContent');
            const passphraseInput = document.getElementById('sshModalPassphrase');

            const password = passwordInput ? passwordInput.value : '';
            const keyPath = keyPathInput ? keyPathInput.value.trim() : '';
            const keyContent = keyContentInput ? keyContentInput.value : '';
            const passphrase = passphraseInput ? passphraseInput.value : '';

            if (!host) {
                showSshBanner('error', '⚠️ Host / IP address is required.');
                return;
            }
            if (!username) {
                showSshBanner('error', '⚠️ Username is required.');
                return;
            }
            if (authType === 'PASSWORD' && !password) {
                const isSaved = passwordInput && passwordInput.placeholder && passwordInput.placeholder.includes('Saved password');
                if (!isSaved) {
                    showSshBanner('error', '⚠️ Password is required for Password Authentication.');
                    return;
                }
            }
            if (authType === 'KEY_FILE' && !keyPath) {
                showSshBanner('error', '⚠️ Private key file path is required.');
                return;
            }
            if (authType === 'KEY_CONTENT' && !keyContent) {
                showSshBanner('error', '⚠️ Inline private key content is required.');
                return;
            }

            const connectBtn = document.getElementById('sshConnectBtn');
            if (connectBtn) {
                connectBtn.disabled = true;
                connectBtn.textContent = 'Connecting...';
            }
            showSshBanner('info', `⏳ Connecting to ${escapeHtml(username)}@${escapeHtml(host)}:${port}...`);

            const autoConnectEl = document.getElementById('sshModalAutoConnect');
            const autoConnect = autoConnectEl ? autoConnectEl.checked : false;

            const payload = {
                host: host,
                port: port,
                username: username,
                authType: authType,
                sessionAlias: sessionAlias,
                autoConnect: autoConnect
            };

            if (authType === 'PASSWORD') payload.password = password;
            if (authType === 'KEY_FILE') {
                payload.privateKeyPath = keyPath;
                if (passphrase) payload.passphrase = passphrase;
            }
            if (authType === 'KEY_CONTENT') {
                payload.privateKeyContent = keyContent;
                if (passphrase) payload.passphrase = passphrase;
            }

            try {
                console.log('[Sandbox UI] Initiating connection payload:', { host, port, username, authType, sessionAlias });
                const res = await fetch('/api/ssh/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                console.log('[Sandbox UI] Response status:', res.status, res.statusText);
                const rawText = await res.text();
                console.log('[Sandbox UI] Raw response body:', rawText);
                let data;
                try {
                    data = rawText ? JSON.parse(rawText) : {};
                } catch (err) {
                    console.error('[Sandbox UI] JSON parse failed on text:', rawText, err);
                    throw new Error(`Server returned status ${res.status} with non-JSON body: ${rawText.substring(0, 200)}`);
                }
                console.log('[Sandbox UI] Parsed response data:', data);

                // Clear secrets from memory immediately
                clearSshSecrets();

                if (res.ok && data.status === 'connected') {
                    showSshBanner('success', `✓ Successfully connected to <strong>${escapeHtml(data.username)}@${escapeHtml(data.host)}:${data.port}</strong> (alias: <code>${escapeHtml(data.alias || sessionAlias)}</code>)`);
                    saveSshConfigNonSensitive(host, port, username, authType, sessionAlias, keyPath, autoConnect);
                    updateSshStatusIndicator(true);
                    checkSshStatus();
                } else {
                    showSshBanner('error', `✕ Connection Failed: ${escapeHtml(data.error || 'Unknown SSH error')}`);
                }
            } catch (err) {
                clearSshSecrets();
                console.error('[Sandbox UI] Connection Exception:', err);
                showSshBanner('error', `✕ Connection Error: ${escapeHtml(err.message)}`);
            } finally {
                if (connectBtn) {
                    connectBtn.disabled = false;
                    connectBtn.textContent = 'Connect';
                }
            }
        }
        const submitSshConnect = connectSsh;

        async function disconnectSsh(alias) {
            const effectiveAlias = alias || document.getElementById('sshModalAlias').value.trim() || 'default';
            const disconnectBtn = document.getElementById('sshDisconnectBtn');
            if (disconnectBtn) {
                disconnectBtn.disabled = true;
                disconnectBtn.textContent = 'Disconnecting...';
            }

            try {
                console.log('[Sandbox UI] Disconnecting session alias:', effectiveAlias);
                const res = await fetch('/api/ssh/disconnect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ alias: effectiveAlias })
                });
                console.log('[Sandbox UI] Disconnect response status:', res.status, res.statusText);
                const rawText = await res.text();
                console.log('[Sandbox UI] Disconnect raw body:', rawText);
                let data;
                try {
                    data = rawText ? JSON.parse(rawText) : {};
                } catch (err) {
                    console.error('[Sandbox UI] Disconnect JSON parse failed:', rawText, err);
                    throw new Error(`Server returned status ${res.status} with non-JSON body: ${rawText.substring(0, 200)}`);
                }
                console.log('[Sandbox UI] Disconnect parsed data:', data);

                if (data.status === 'disconnected') {
                    showSshBanner('info', `Session <code>${escapeHtml(effectiveAlias)}</code> disconnected.`);
                } else {
                    showSshBanner('info', `Session <code>${escapeHtml(effectiveAlias)}</code> is not active.`);
                }
                checkSshStatus();
            } catch (err) {
                console.error('[Sandbox UI] Disconnect Exception:', err);
                showSshBanner('error', `Disconnect error: ${escapeHtml(err.message)}`);
            } finally {
                if (disconnectBtn) {
                    disconnectBtn.disabled = false;
                    disconnectBtn.textContent = 'Disconnect';
                }
            }
        }

        async function checkSshStatus() {
            try {
                console.log('[Sandbox UI] Checking SSH status via /api/ssh/status');
                const res = await fetch('/api/ssh/status');
                console.log('[Sandbox UI] Status response status:', res.status, res.statusText);
                const rawText = await res.text();
                let data;
                try {
                    data = rawText ? JSON.parse(rawText) : {};
                } catch (err) {
                    console.error('[Sandbox UI] Status JSON parse failed:', rawText, err);
                    updateSshStatusIndicator(false);
                    return;
                }
                if (!res.ok) {
                    updateSshStatusIndicator(false);
                    return;
                }
                const isConnected = !!data.connected;
                updateSshStatusIndicator(isConnected);

                const activeArea = document.getElementById('sshActiveSessionsArea');
                const listEl = document.getElementById('sshActiveSessionsList');
                const disconnectBtn = document.getElementById('sshDisconnectBtn');

                if (data.sessions && data.sessions.length > 0) {
                    if (activeArea) activeArea.style.display = 'block';
                    if (disconnectBtn) disconnectBtn.style.display = 'inline-block';
                    if (listEl) {
                        listEl.innerHTML = data.sessions.map(s => `
                            <div class="ssh-active-item">
                                <div>
                                    <span style="color:var(--green);font-weight:600;">●</span>
                                    <strong>${escapeHtml(s.username)}@${escapeHtml(s.host)}:${s.port}</strong>
                                    <span style="opacity:0.7;">(alias: <code>${escapeHtml(s.alias)}</code>)</span>
                                </div>
                                <button onclick="disconnectSsh('${escapeHtml(s.alias)}')" style="background:var(--red);color:white;border:none;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:11px;">✕ Terminate</button>
                            </div>
                        `).join('');
                    }
                } else {
                    if (activeArea) activeArea.style.display = 'none';
                    if (disconnectBtn) disconnectBtn.style.display = 'none';
                }
            } catch (e) {
                console.error('[Sandbox UI] checkSshStatus error:', e);
                updateSshStatusIndicator(false);
            }
        }
        const fetchSshStatus = checkSshStatus;

        function updateSshStatusIndicator(connected) {
            const dot = document.getElementById('sshStatusDot') || document.getElementById('sshHeaderDot');
            if (dot) {
                dot.className = 'ssh-status-dot ' + (connected ? 'connected' : 'disconnected');
            }
            const headerBtn = document.getElementById('sshHeaderBtn');
            if (headerBtn) {
                headerBtn.title = connected ? 'Sandbox: Connected' : 'Sandbox: Disconnected (Click to Connect)';
            }
        }

        // Global ESC handler for SSH modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const overlay = document.getElementById('sshModalOverlay');
                if (overlay && overlay.classList.contains('active')) {
                    closeSshModal();
                }
            }
        });

        // Periodic SSH status check every 15s
        setInterval(checkSshStatus, 15000);
        checkSshStatus();

    </script>

    <!-- Sandbox Connection Modal -->
    <div class="ssh-modal-overlay" id="sshModalOverlay" onclick="if(event.target===this) closeSshModal()">
        <div class="ssh-modal-card">
            <div class="ssh-modal-header">
                <div>
                    <h3 style="margin:0; font-size:14px; font-weight:600; display:flex; align-items:center; gap:6px;"><span>📦 Sandbox Environment (Remote Ubuntu)</span></h3>
                    <p style="margin: 3px 0 0 0; font-size: 11px; color: var(--text-dim);">Connect to a remote sandboxed machine to run commands and execute code safely.</p>
                </div>
                <button class="ssh-modal-close-btn" onclick="closeSshModal()" title="Close (Esc)">✕</button>
            </div>
            <div class="ssh-modal-body">
                <div class="ssh-status-banner" id="sshModalStatusBanner"></div>

                <div id="sshActiveSessionsArea" style="display:none;" class="ssh-active-sessions">
                    <div class="ssh-active-header">
                        <span>Active Sandbox Sessions</span>
                        <button onclick="checkSshStatus()" style="background:none;border:none;color:var(--cyan);cursor:pointer;font-size:11px;">🔄 Refresh</button>
                    </div>
                    <div id="sshActiveSessionsList"></div>
                </div>

                <div class="ssh-form-row row-split">
                    <div style="flex: 2;">
                        <label class="ssh-form-label" for="sshModalHost">Host / IP <span class="req">*</span></label>
                        <input type="text" id="sshModalHost" class="ssh-form-input" placeholder="e.g. 192.168.1.100 or ubuntu.example.com" autocomplete="off" />
                    </div>
                    <div style="flex: 1;">
                        <label class="ssh-form-label" for="sshModalPort">Port <span class="req">*</span></label>
                        <input type="number" id="sshModalPort" class="ssh-form-input" value="22" autocomplete="off" />
                    </div>
                </div>

                <div class="ssh-form-row row-split">
                    <div style="flex: 1;">
                        <label class="ssh-form-label" for="sshModalUser">Username <span class="req">*</span></label>
                        <input type="text" id="sshModalUser" class="ssh-form-input" placeholder="e.g. ubuntu or root" autocomplete="off" />
                    </div>
                    <div style="flex: 1;">
                        <label class="ssh-form-label" for="sshModalAlias">Session Alias</label>
                        <input type="text" id="sshModalAlias" class="ssh-form-input" value="default" autocomplete="off" />
                    </div>
                </div>

                <div class="ssh-form-row">
                    <label class="ssh-form-label" for="sshModalAuthType">Authentication Method</label>
                    <select id="sshModalAuthType" class="ssh-form-select" onchange="onSshAuthTypeChange()">
                        <option value="PASSWORD">Password</option>
                        <option value="KEY_FILE">Private Key File Path</option>
                        <option value="KEY_CONTENT">Inline Private Key</option>
                    </select>
                </div>

                <!-- Password Auth Row -->
                <div class="ssh-form-row" id="sshRowPassword">
                    <label class="ssh-form-label" for="sshModalPassword">Password <span class="req">*</span></label>
                    <input type="password" id="sshModalPassword" class="ssh-form-input" placeholder="Enter remote Sandbox password" autocomplete="new-password" spellcheck="false" />
                </div>

                <!-- Key File Path Row -->
                <div class="ssh-form-row" id="sshRowKeyPath" style="display:none;">
                    <label class="ssh-form-label" for="sshModalKeyPath">Private Key Path <span class="req">*</span></label>
                    <input type="text" id="sshModalKeyPath" class="ssh-form-input" placeholder="e.g. ~/.ssh/id_rsa or /home/ubuntu/.ssh/id_ed25519" autocomplete="off" />
                </div>

                <!-- Inline Key Content Row -->
                <div class="ssh-form-row" id="sshRowKeyContent" style="display:none;">
                    <label class="ssh-form-label" for="sshModalKeyContent">Inline Private Key PEM/OpenSSH <span class="req">*</span></label>
                    <textarea id="sshModalKeyContent" class="ssh-form-textarea" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----&#10;...&#10;-----END OPENSSH PRIVATE KEY-----" autocomplete="new-password" spellcheck="false" rows="5"></textarea>
                </div>

                <!-- Passphrase Row (for encrypted keys) -->
                <div class="ssh-form-row" id="sshRowPassphrase" style="display:none;">
                    <label class="ssh-form-label" for="sshModalPassphrase">Key Passphrase <span style="font-weight:normal;opacity:0.7;">(optional)</span></label>
                    <input type="password" id="sshModalPassphrase" class="ssh-form-input" placeholder="Passphrase for private key (if encrypted)" autocomplete="new-password" />
                </div>

                <!-- Auto-Connect on Startup Option -->
                <div class="ssh-form-row" style="margin-top: 10px; margin-bottom: 2px;">
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:12px; user-select:none;">
                        <input type="checkbox" id="sshModalAutoConnect" style="cursor:pointer; width:15px; height:15px; accent-color:var(--accent);" />
                        <span style="font-size:13px; font-weight:500;">Auto-connect on startup</span>
                    </label>
                </div>
            </div>
            <div class="ssh-modal-footer">
                <button class="ssh-btn ssh-btn-disconnect" id="sshDisconnectBtn" onclick="disconnectSsh()" style="display:none;">Disconnect</button>
                <div class="ssh-footer-actions" style="margin-left:auto;">
                    <button class="ssh-btn ssh-btn-cancel" onclick="closeSshModal()">Cancel</button>
                    <button class="ssh-btn ssh-btn-connect" id="sshConnectBtn" onclick="connectSsh()">Connect</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
